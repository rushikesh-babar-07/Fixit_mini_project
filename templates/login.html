{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-icon mx-auto mb-3" style="width:52px; height:52px; font-size:22px;">
                <i class="bi bi-lightning-fill"></i>
            </div>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Login to report and upvote issues in your area</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="form-dark p-0 border-0 bg-transparent">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-accent w-100" style="padding: 12px;">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login to FixIt
            </button>
        </form>

        <p class="text-center mt-4 mb-3" style="color:var(--text-muted); font-size:0.875rem;">
            Don't have an account? <a href="{{ url_for('register') }}" class="text-accent fw-600">Register here</a>
        </p>

        <div style="background:rgba(108,99,255,0.05); border:1px solid rgba(108,99,255,0.2); border-radius:8px; padding:12px; text-align:center;">
            <small style="color:var(--text-muted);">
                <i class="bi bi-shield-fill me-1 text-accent"></i>
                <strong class="text-white">Admin Demo:</strong> admin@fixit.com / admin123
            </small>
        </div>
    </div>
</div>
{% endblock %}
