{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-icon mx-auto mb-3" style="width:52px; height:52px; font-size:22px;">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join FixIt — Team FixForce, TKIET Warananagar</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}" class="form-dark p-0 border-0 bg-transparent">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="Your Name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required>
            </div>
            <div class="mb-4">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="btn btn-accent w-100" style="padding: 12px;">
                <i class="bi bi-person-check-fill me-2"></i>Create Account
            </button>
        </form>

        <p class="text-center mt-4" style="color:var(--text-muted); font-size:0.875rem;">
            Already have an account? <a href="{{ url_for('login') }}" class="text-accent">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
